server:
  port: 8080

spring:
  application:
    name: urlshortener
  datasource:
    url: jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    cache-names: shortUrlCache
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m

app:
  base-url: http://localhost:8080
  short-code:
    length: 7
  rate-limit:
    capacity: 20
    refill-per-minute: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
